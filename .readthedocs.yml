version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: "3.12"
  apt_packages:
    - graphviz
  jobs:
    build:
      html:
        - python -c "import time; [print(chr(120) * 130, i, flush=True) or time.sleep(0.25) for i in range(2300)]"
        - mkdir -p $READTHEDOCS_OUTPUT/html
        - echo "diagnostic build" > $READTHEDOCS_OUTPUT/html/index.html

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - doc

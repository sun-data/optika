version: 2

# Diagnostic: build the docs on Python 3.12, and stop Sphinx at 830 s after the
# checkout, before the 15-minute limit of Read the Docs, so that its output is
# kept and shows how far it got. A line with the time is printed every minute.
build:
  os: ubuntu-lts-latest
  tools:
    python: "3.12"
  apt_packages:
    - graphviz
  jobs:
    post_checkout:
      - date +%s > build-start.txt
    build:
      html:
        - LEFT=$(( 830 - $(date +%s) + $(cat build-start.txt) )); echo "timeout $LEFT s"; (while sleep 60 > /dev/null 2>&1; do echo "=== $(date -u +%T)"; done) & CLOCK=$!; date -u; cd docs && timeout $LEFT python -m sphinx -T -b html -d _build/doctrees -D language=en . $READTHEDOCS_OUTPUT/html; STATUS=$?; kill $CLOCK; date -u; echo "sphinx exit $STATUS"; exit $STATUS

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - doc
